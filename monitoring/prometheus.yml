global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "vector-coordinator"
    static_configs:
      - targets: ["localhost:3030"]

  - job_name: "vector-workers"
    static_configs:
      - targets:
          - "localhost:9101"
          - "localhost:9102"
          - "localhost:9103"
          - "localhost:9104"
          - "localhost:9105"
